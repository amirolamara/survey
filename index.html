:root{--bg:#FFFBEA;--cd:#fff;--tx:#0B0B2B;--mu:#5C5C85;--pr:#00008B;--bt:#00008B;--bx:#fff;--sl:#E8E8FA;--bd:#D8D8EE;--ok:#2E9E5B;--er:#C62828;--ac:#EFBF04;--pl:#8C8CB8;--o1:#00008B;--o2:#00005F;--o3:#EFBF04;--o4:#C99A00}
[data-theme=dark]{--bg:#08080F;--cd:#14142E;--tx:#F5F1E0;--mu:#B7B3C9;--pr:#EFBF04;--bt:#EFBF04;--bx:#0A0A18;--sl:#23235C;--bd:#2E2E6B;--er:#FF8A80;--pl:#6C6CA0;--o1:#2B2BC4;--o2:#1C1C8F}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.8 Sahel,Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{max-width:640px;margin:0 auto;padding:54px 14px 12px}
#top{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px}#tu{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start}
#fp{flex:none;width:38px;animation:fin .9s ease-out both}#fp svg{display:block;overflow:visible}
#tg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:var(--cd);font-size:22px;line-height:1;cursor:pointer;z-index:5}
.st{font-weight:700;font-size:14px;color:var(--pr);margin-bottom:4px}
.bar{display:flex;gap:4px;margin-bottom:10px}.bar i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.bar i.d{background:var(--pr)}.bar i.c{background:var(--ok)}
h1{font-size:18px;margin:0 0 8px}

if(q.k=="l"){h+='<div class="lk">';for(i=1;i<=5;i++)h+='<button type="button" class="lb'+(v==i?' on':'')+'" onclick="pick(\''+q.id+'\','+i+')"><b>'+fa(i)+'</b><span>'+S.roles[role].scale[i-1]+'</span></button>';h+='</div>'}
else if(q.k=="s"&&q.sel){h+='<select onchange="pick(\''+q.id+'\',+this.value)"><option value="">انتخاب کنید…</option>';q.o.forEach(function(t,j){h+='<option value="'+(j+1)+'"'+(v==j+1?' selected':'')+'>'+t+'</option>'});h+='</select>'}
else if(q.k=="s"||q.k=="m"){q.o.forEach(function(t,j){var on=q.k=="m"?(v||[]).indexOf(j+1)>=0:v==j+1;h+='<label class="o'+(on?' on':'')+'"><input type="'+(q.k=="m"?'checkbox':'radio')+'" name="'+q.id+'"'+(on?' checked':'')+' onchange="'+(q.k=="m"?'pickM(\''+q.id+'\','+(j+1)+','+(q.ex||0)+')':'pick(\''+q.id+'\','+(j+1)+')')+'"><span>'+t+'</span></label>'});
 if(q.other&&v==q.other)h+='<input type="text" placeholder="توضیح (اختیاری)" value="'+(O[q.id]||'').replace(/"/g,'&quot;')+'" oninput="setO(\''+q.id+'\',this.value)">'}
else h+='<input type="text" '+(q.k=="n"?'inputmode="numeric" ':'')+'value="'+(A[q.id]==null?'':A[q.id])+'" oninput="setV(\''+q.id+'\',this.value)">';
return h+(E[q.id]?'<div class="em" id="e_'+q.id+'">'+E[q.id]+'</div>':'')+'</div>'}
function hd(x,y,t){return '<div class="st">مرحله '+fa(x)+(y?' از '+fa(y):'')+' — '+t+'</div>'+(y?'<div class="bar">'+Array.apply(null,Array(y)).map(function(_,i){return '<i class="'+(i+1<x?'d':i+1==x?'c':'')+'"></i>'}).join('')+'</div>':'')}
function draw(a){var hx='',tt='',h=DEMO?'<div class="dm">حالت پیش‌نمایش — پاسخ‌ها ارسال نمی‌شود</div>':'';
if(pi<0){var n=nestOn;nestOn=0;hx=hd(1,0,'شروع');tt=tu('student',T.start,a,n,n?1.6:0);h+='<div class="qt">این نظرسنجی را به‌عنوان چه کسی پر می‌کنید؟</div><button class="btn big" onclick="setRole(\'student\')">دانش‌آموز</button><button class="btn big" onclick="setRole(\'parent\')">والدین</button>'}
else if(role&&pi>=pages.length){tt=tu(role,T[role].end,a);h+='<div class="th"><div class="zw"><img class="zf" src="'+FLAG_IMG+'" alt=""></div><div class="zt"><h1>'+S.roles[role].thanks+'</h1><p>'+T[role].thx+'</p>'+(S.dup?'<p class="lg">پاسخ شما پیش‌تر ثبت شده بود.</p>':'')+'</div></div>'}
else if(!role){tt=tu('student','ممنون که قبلاً نظرتان را داده‌اید 🙂',a);h+='<div class="th"><h1>پاسخ شما پیش‌تر ثبت شده است.</h1></div>'}
else{var p=pages[pi],Y=pages.length+1;hx=hd(pi+2,Y,p.t);tt=tu(role,rem(pi),a);
 p.q.forEach(function(q){if(vis(q))h+=qH(q)});
 h+='<div id="msg"></div><div class="nv"><button class="btn g" onclick="back()">بازگشت</button><button class="btn" id="nx" onclick="next()"'+(busy?' disabled':'')+'>'+(pi==pages.length-1?'ارسال':'ادامه')+'</button></div>'}
$("tu").innerHTML=tt;$("hx").innerHTML=hx;$("app").innerHTML=h;flagTo()}
function msg(t){var m=$("msg");if(m)m.textContent=t}
function missing(){var m=[];E={};pages[pi].q.forEach(function(q){if(!vis(q)||q.opt)return;var v=A[q.id],ok;
 if(q.k=="m")ok=v&&v.length;else if(q.k=="n"){var n=+en(v==null?"":v);ok=v!=null&&String(v).trim()!==""&&n>=q.min&&n<=q.max}else ok=v!=null&&v!=="";
 if(!ok){E[q.id]=q.k=="n"?"سن را به‌صورت عدد بین "+fa(q.min)+" تا "+fa(q.max)+" وارد کنید.":"لطفاً به این پرسش پاسخ دهید.";m.push(q.id)}});return m}
function next(){var m=missing();if(m.length){keep();var el=$("q_"+m[0]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});return}
 E={};if(pi==pages.length-1)return send();pi++;draw(1);window.scrollTo(0,0)}
function back(){E={};pi--;draw(1);window.scrollTo(0,0)}
function payload(){var a={},o={};S.roles[role].sections.forEach(function(s){s.q.forEach(function(q){if(!vis(q)||A[q.id]==null)return;a[q.id]=q.k=="n"?+en(A[q.id]):q.k=="t"?en(A[q.id]).trim():A[q.id];if(q.other&&A[q.id]==q.other&&O[q.id])o[q.id]=en(O[q.id]).trim()})});
 var t=null;try{t=localStorage.getItem("stem_tok");if(!t){t="t"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("stem_tok",t)}}catch(e){}
 return {v:S.v,role:role,tok:t||("t"+Math.random().toString(36).slice(2)),a:a,o:o}}
function fin(){try{localStorage.setItem("stem_done","1")}catch(e){}pi=pages.length;draw(1);window.scrollTo(0,0)}
function send(){if(busy)return;if(DEMO)return fin();
 if(!API){msg("اتصال تنظیم نشده است؛ لطفاً مدیر سایت را مطلع کنید.");return}
 busy=true;var b=$("nx");if(b)b.disabled=true;var c=new AbortController(),tm=setTimeout(function(){c.abort()},25000);
 fetch(API,{method:"POST",body:JSON.stringify(payload()),signal:c.signal}).then(function(r){return r.json()}).then(function(j){clearTimeout(tm);busy=false;if(j&&j.ok){S.dup=!!j.dup;fin()}else{draw();msg((j&&j.err)||"ارسال انجام نشد.")}}).catch(function(){clearTimeout(tm);busy=false;draw();msg("ارسال انجام نشد. اینترنت را بررسی کنید و دوباره بزنید؛ پاسخ‌های شما حفظ شده است.")})}
setT(theme());(function(){var f=$("fi");if(f&&f.setAttribute)f.setAttribute("href",FLAG_IMG)})();
(function(){var d=false;try{d=localStorage.getItem("stem_done")=="1"}catch(e){}if(d&&!DEMO)pi=0;draw(1)})();
setInterval(function(){if(!manual)setT(theme())},60000);
</script></body></html>
